# Murid Configuration

# One entry per Hardcover user. Token-only entries sync Want to Read.
# Must start with "Bearer "
hardcover_api_keys:
  - !ENV HARDCOVER_API_KEY
  # Group lists under one token using their URL slugs:
  # - api_key: !ENV SECOND_HARDCOVER_API_KEY
  #   reading_list:
  #     want-to-read: {} # type defaults to ebook
  #     books-to-download:
  #       type: ebook
  #     audiobooks:
  #       type: audiobook
  # Omitting reading_list defaults to Want to Read ebooks.
  # type: [ebook, audiobook] requests both independently.
  # Audiobook configuration is accepted, but execution is not yet supported.

# Redact secrets from logs and config dumps
redact_sensitive_data: true

# Match confidence threshold (0.0 - 1.0)
matcher_threshold: 0.92

# MyAnonamouse cookie
mam_id: !ENV MAM_ID

# Preferred language codes for torrent filtering and language-tagged Hardcover titles
lang_codes:
  - "ENG"

# Calibre settings (required only when ebooks are requested)
calibre:
  calibredb_executable: "calibredb"
  command_timeout_seconds: 120 # Maximum runtime for each calibredb command
  library: "http://localhost:8080/#books" # Or a local library path
  server_username: "user"
  server_password: !ENV CALIBRE_PASSWORD

# Required only when audiobooks are requested. API key is always redacted in output.
# audiobookshelf:
#   url: https://audiobooks.example.com
#   api_key: !ENV AUDIOBOOKSHELF_API_KEY
#   library_id: your-library-id
#   library_path: /mnt/audiobooks # Absolute path as seen by Murid
#   filetypes: [m4b, mp3]

# qBittorrent connection settings
qbittorrent:
  host: "localhost"
  port: 8080
  username: "admin"
  password: !ENV QBITTORRENT_PASSWORD

  # Verify TLS certificates
  verify_cert: true

  # Category assigned to torrents added by Murid
  category: "murid"

  # Optional path mapping when qBittorrent runs in a different environment
  # (e.g. Docker container)
  mapping:
    qbit_path: null
    murid_path: null

    # Example:
    # qbit_path: "/downloads"
    # murid_path: "/mnt/downloads"

# Cron schedule for automatic runs
# Default: every hour
schedule: "0 * * * *"

# Optional Apprise notification URLs
# Set to null to disable notifications
apprise: null

# Example:
# apprise:
#   - "discord://webhook_id/webhook_token"
#   - "telegram://bot_token/chat_id"

# Accepted ebook formats, most preferred first
filetypes:
  - epub
  - mobi
  - azw3
  - azw

# Torrent IDs that should never be processed
blacklisted_torrent_ids: []

# Example:
# blacklisted_torrent_ids:
#   - 12345
#   - 67890

# Maximum time to wait for a torrent to complete (seconds)
torrent_timeout_seconds: 1800
